schema: spec-driven

# Project context: only what an agent cannot infer by reading the code.
context: |
  Write all OpenSpec artifacts in English. The repository is public: artifacts describe the system, not
  people. No quotes from conversations, no notes on who asked, chose or uses what, no personal machines,
  accounts, host names or paths (examples use me@192.0.2.x and /home/me).
  Archived changes (openspec/changes/archive/) are gitignored and stay local; the main specs are the record.
  Platforms: Linux and macOS run server and desktop app natively; on Windows the WebView2 app is
  native while server, PTYs and shells run inside WSL 2. Changes must not silently break either side.
  The Rust server is the source of truth for workspace state; the web UI and desktop shells are clients.
  Internal architecture (how it is built) lives in docs/architecture.md and is deliberately not specced. The
  module-level map is the architecture model in architecture/*.c4 (conventions in architecture/README.md):
  every crate and top-level module as a component with the dependencies allowed between them; cargo test
  checks it against the code in both directions.
  Architecture invariants (apply to every change; docs/architecture.md explains them):
  - Layout changes are ops. The reducer is a pure function (state, op) -> (state, effects); ops, validation,
    state and the grid projection do no I/O. Within the mux, only the effect runner executes effects and
    touches the PTY layer (checked: mux::effect_runner is a component of its own, and the model has no
    relationship from mux to pty or effect_runner).
  - An op states an intent and has the same wire format whether a client applies it optimistically or the
    server authoritatively. The server owns the PTY lifecycle of mux panes: every op runs its effects, whether
    it arrives over the WebSocket, from the CLI or through the control API, and a client attaches to the
    session spawned for its pane (mux.pane_spawned) through the session protocol.
  - Pane and screen IDs are generated by the client; the server generates them only for ops that omit them.
  Wire payload shapes live in docs/protocol.ts; specs describe semantics and refer to it. protocol.ts is
  partly stale (see docs/issues/openspec-baseline-findings.md); where it disagrees with the Rust protocol
  types, the code wins, and a change touching the protocol fixes protocol.ts along the way.
  openspec/specs/access-control holds security invariants hardened in 2026; SECURITY.md and
  docs/security/ explain the background. A change that weakens them needs an explicit REMOVED/MODIFIED
  delta with a reason, never an incidental side effect.
  Known bugs, stale docs and test gaps found while writing the baseline specs are listed in
  docs/issues/openspec-baseline-findings.md; specs state guarantees and deliberately leave those bugs out.
  roadmap/ holds strategy and ideas (German). A roadmap doc is input for a proposal, not truth about
  current behavior: the code and openspec/specs are.

rules:
  proposal:
    - Link the roadmap milestone (roadmap/NNN-*.md) the change implements, if there is one
    - State explicitly what is out of scope
    - A draft collects input for its later design under "Carried-over design notes" - findings, worklists and decisions from other changes, each with its date and the change it came from
    - A proposal of the light schema (no design) states the architecture impact in its "Architecture impact" line, as a design's section would; its provisional decisions are marked "(provisional, tbd)" and also get a bullet in openspec/open-decisions.md
  specs:
    - Behavior contracts only; no Rust type, module, crate or library names
    - Wire names (message types, HTTP paths, env vars, CLI commands and flags, on-disk paths) are part of the contract and belong in specs
    - Change existing capabilities with MODIFIED deltas; check `openspec list --specs` before adding a new capability
    - For UI parts (the web frontend, the desktop shells' windows), requirements cover only what crosses the protocol or an API and UX concepts or decisions not evident from the built app; no WHEN/THEN per screen detail, layout, label or style
  design:
    - Every design has an "Architecture impact" section naming the components and relationships of architecture/*.c4 and the concept sections of docs/architecture.md it adds, changes or removes, or stating "none"
    - Decisions taken without the maintainer's confirmation, to keep going, are listed under "Provisional decisions" with their decision ids and the date, open to the maintainer's feedback, and each also gets a bullet in openspec/open-decisions.md
  tasks:
    - Every new or modified scenario gets a test task
    - When the architecture impact is not "none", the tasks update architecture/*.c4 (and docs/architecture.md where a concept changes) in the same change
    - When the change touches the wire protocol, the tasks bring docs/protocol.ts in line for the touched messages
    - Every test task names its level (unit, in-process, smoke as CLAUDE.md defines them) and extends an existing test where one fits; a new smoke test (a real splitty process) states why an in-process test cannot show it
    - Every task list ends with targeted tests of what the change touched and then the one full check before the merge as CLAUDE.md lists it - cargo fmt --all --check, cargo clippy --workspace --exclude splitty-gui --all-targets -- -D warnings and cargo test --workspace --exclude splitty-gui; when the change touches crates/splitty-tauri, cargo clippy -p splitty-gui --all-targets -- -D warnings and cargo test -p splitty-gui --lib as well; when it touches frontend/, pnpm check, pnpm test and pnpm build there; and openspec validate --specs. cargo test runs the architecture check, which needs pnpm install --dir architecture once

operations:
  apply:
    guidance:
      - During the work run only the targeted tests of what you touch; run the full check once, at the end (CLAUDE.md, Checks)
      - 'Do not stop for decisions the maintainer has not made: decide, mark the decision "(provisional, tbd)" in the change and add a bullet to openspec/open-decisions.md'
      - Look the components up in the architecture model (architecture/*.c4) before adding a crate, a top-level module or a dependency between components, and update the model in the same change; the failing architecture check names the missing relationship
      - Read the baseline specs the change modifies before touching code; a requirement the code turns out not to meet goes into docs/issues/openspec-baseline-findings.md or into this change, never silently around it
      - 'Lint suppressions name the lint and the reason as #[expect(<lint>, reason = "...")], not a bare #[allow]; a suppression, an unwrap() or an `as` cast is never added only to make the compiler or clippy pass'
  archive:
    guidance:
      - Draft changes (proposal only, marked "Draft" in their first lines) are never archived; they have no deltas yet
      - After the change is archived and its specs are synced, commit right away without asking again, on the current branch; never push
      - 'Split the commits in this order - pending planning work outside the change (e.g. "docs(openspec): draft <other-change>"), then the implementation as "<type>(<scope>): <what it does>" (code, lockfiles, tests; type feat, fix, security etc. as in the git log), then "docs(openspec): archive <change> and sync its specs" (the new or updated main specs and the removed change folder; the archive folder is gitignored)'
      - Keep ignored output (target/, frontend/dist, node_modules, build/) out of the commits

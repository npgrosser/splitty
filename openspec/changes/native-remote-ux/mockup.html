function ownership(){return '<article class="ownership"><div class="eyebrow">Design review · proposed ownership, not a product screen</div><h2>A shared service. Your connection to it.</h2><p>Names describe what is running. Local forwarding describes how this environment reaches it.</p><div class="ownership-flow"><div class="owner-card"><div class="eyebrow">Remote workspace · same account</div><h3>Devbox / API</h3><p>Service name, protocol and observed process.<br>Consistent across clients of this workspace.</p><code>127.0.0.1:8080 · python</code></div><div class="owner-arrow">→</div><div class="owner-card"><div class="eyebrow">Initiating local environment</div><h3>This computer</h3><p>Live tunnel, preferred local port, restore setting.<br>Another device chooses its own local endpoint.</p><code>http://localhost:8081</code></div></div><table><thead><tr><th>When you…</th><th>What happens</th></tr></thead><tbody><tr><td>Rename the remote service</td><td>Other clients see the name. Their tunnels stay unchanged.</td></tr><tr><td>Close a screen or the port menu</td><td>The forward and remote processes keep running.</td></tr><tr><td>Stop forwarding here</td><td>This owner’s tunnel stops. Saved restoration is paused.</td></tr><tr><td>Quit the owning native app</td><td>Its tunnels end. Remote screens keep running.</td></tr></tbody></table><div class="ownership-note"><strong>Current implementation:</strong> discovery is already remote-owned; custom port labels are still local mapping preferences. Shared names need a new capability. Existing private labels must not be published automatically.<br><strong>Web caveat:</strong> a tunnel binds on the backend machine. If the browser is elsewhere, “localhost” is not that endpoint. “This computer” is only valid when that local environment is actually reachable.</div></article>';}

 if(state.modal)return;

 reopen.type='button';reopen.className='link-btn';reopen.textContent='Reopen';reopen.dataset.action='open-screen';reopen.dataset.host=host;reopen.dataset.screen=id;notice.append(reopen);
}
function dismiss(){const target=lastFocus;state.modal=null;render(false);if(target)document.querySelector(target)?.focus({preventScroll:true});}
document.addEventListener('click',e=>{if(suppressClick){suppressClick=false;e.preventDefault();return;}const b=e.target.closest('[data-action]');if(!b){if(e.target.classList.contains('layer'))dismiss();return;}const action=b.dataset.action,id=b.dataset.port,h=b.dataset.host;lastFocus=b.hasAttribute('data-host')?'[data-action="'+action+'"][data-host="'+h+'"]':'[data-action="'+action+'"]';if(action==='scene'){scene(b.dataset.scene);return;}if(action==='reset'){Object.assign(hosts,JSON.parse(hostSeed));state=initial();scene('workspace');return;}if(action==='dismiss'){dismiss();return;}if(action==='host'||action==='choose-host'){showHost(h);return;}if(action==='hosts'){showHost(state.host);return;}if(action==='quick-ports'){state.host=h;state.modal='quick';render();return;}if(action==='manage-ports'){state.host='dev';state.tab='ports';state.modal='hosts';render();return;}if(action==='ports-tab'||action==='screens-tab'){state.tab=action==='ports-tab'?'ports':'screens';render();return;}if(action==='connect'){state.auth='target';state.modal='connect';render();return;}if(action==='trust'){state.auth='password';render();return;}if(action==='connect-host'){state.connected[h]=true;render();toast('Sample: connected to '+hosts[h].name+'.');return;}if(action==='open-screen'){openScreen(h,b.dataset.screen);return;}if(action==='screen-filter'){state.screenFilter=b.dataset.filter;render();return;}if(action==='detach-screen'){detachScreen(h,b.dataset.screen);return;}if(action==='new-screen'){const nid='screen-'+Date.now();if(h==='local'){state.opened.local.push(nid);state.selected=nid;state.modal=null;render(false);}else{hosts[h].screens.push([nid,'New screen','1 pane · ~']);openScreen(h,nid);}return;}if(action==='select-screen'){state.selected=b.dataset.screen;render(false);return;}if(action==='port-settings'||action==='resolve'){state.editing=id;state.modal='port';render();return;}if(action==='back-ports'){state.modal='hosts';state.tab='ports';render();return;}if(action==='stop-port'){const p=port(id);p.up=false;p.restore=false;render();toast('Stopped here. Automatic restoration is paused.');return;}if(action==='port-primary'){const p=port(id);if(p.up){toast('Sample: '+(p.kind==='TCP'?'copy 127.0.0.1:':p.kind==='HTTPS'?'open https://localhost:':'open http://localhost:')+p.local+' (no external action).');}else if(state.conflict&&p.id==='db'){state.editing=id;state.modal='port';render();}else{p.up=true;render();toast('Sample: forwarding '+p.remote+' → localhost:'+p.local+(p.kind==='TCP'?'.':' and opening in browser.'));}return;}if(action==='add-port'){state.modal='add';render();return;}if(action==='recover'){state.reconnecting=false;port('front').up=true;state.connected.dev=true;render(false);toast('Sample: connection restored.');return;}if(action==='unmodeled'||action==='pin')toast('Outside this remote UX study.');});
document.addEventListener('input',e=>{if(e.target.id==='host-search'){state.search=e.target.value;document.querySelector('#host-results').innerHTML=hostList();}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,f=new FormData(form);if(form.id==='port-form'){const p=port(state.editing),resolving=state.conflict&&p.id==='db';if(resolving&&Number(f.get('localPort'))===5433){toast('Local port 5433 is still in use. Choose another port.');return;}p.name=String(f.get('serviceName')).trim()||p.name;if(!p.up)p.local=Number(f.get('localPort'));p.restore=f.has('restore');p.saved=true;if(resolving){state.conflict=false;p.up=true;}state.modal='hosts';state.tab='ports';render();toast(resolving?'Sample: forwarding verified on localhost:'+p.local+'. Settings saved.':'Sample: settings saved. No forward was started.');}if(form.id==='connect-form'){if(state.auth==='target'){state.target=String(f.get('target')).trim();state.auth='trust';render();}else{form.querySelector('input[type=password]').value='';state.connected.lab=true;state.host='lab';state.tab='screens';state.modal='hosts';render();toast('Sample: signed in. No screen was created.');}}if(form.id==='add-form'){const remote=Number(f.get('remote')),local=Number(f.get('local'))||remote;if(state.ports.some(p=>p.remote===remote||p.up&&p.local===local)){document.querySelector('#form-error').textContent='This remote port is already listed, or the local port is in use.';return;}state.ports.push({id:'manual-'+remote,name:'Port '+remote,remote,local,process:'manual',kind:f.get('kind'),up:true,saved:f.has('restore'),restore:f.has('restore')});state.modal='hosts';state.tab='ports';render();toast('Sample: port forwarded.');}});
function reorder(list,from,to){const result=list.slice(),[item]=result.splice(from,1);result.splice(to,0,item);return result;}
function finishDrag(cancel=false){if(!drag)return;const d=drag,oldRect=d.ghost?.getBoundingClientRect();drag=null;document.body.classList.remove('dragging');if(d.active){suppressClick=true;setTimeout(()=>{suppressClick=false;},0);if(!cancel&&d.to!==d.from){if(d.type==='group')state.order=reorder(state.order,d.from,d.to);else state.opened[d.group]=reorder(state.opened[d.group],d.from,d.to);}render(false);const selector=d.type==='group'?'[data-drag-group="'+d.group+'"]':'[data-screen="'+d.id+'"]';const dropped=document.querySelector(selector),surface=d.type==='group'?dropped?.closest('.group'):dropped;dropped?.focus({preventScroll:true});if(!cancel&&surface&&oldRect&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const delta=oldRect.top-surface.getBoundingClientRect().top;surface.animate([{transform:'translateY('+delta+'px)'},{transform:'translateY(0)'}],{duration:180,easing:'cubic-bezier(.2,.75,.25,1)'});}}}
document.addEventListener('pointerdown',e=>{if(e.button!==0||state.modal)return;const handle=e.target.closest('[data-drag-group],.group-title[data-host]'),card=e.target.closest('.screen');if(!handle&&!card)return;const type=handle?'group':'screen',el=handle?handle.closest('.group'):card;const parent=el.parentElement;const siblings=Array.from(parent.children).filter(x=>x.matches(type==='group'?'.group':'.screen'));drag={type,el,parent,siblings,group:handle?(handle.dataset.dragGroup||handle.dataset.host):card.dataset.group,id:card?.dataset.screen,from:siblings.indexOf(el),to:siblings.indexOf(el),startX:e.clientX,startY:e.clientY,active:false,rect:el.getBoundingClientRect(),bounds:parent.getBoundingClientRect(),heights:siblings.map(x=>x.getBoundingClientRect())};});
document.addEventListener('pointermove',e=>{if(!drag)return;const d=drag,dy=e.clientY-d.startY;if(!d.active&&Math.hypot(e.clientX-d.startX,dy)<5)return;if(!d.active){d.active=true;document.body.classList.add('dragging');const ghost=d.el.cloneNode(true);ghost.classList.add('drag-ghost');ghost.removeAttribute('data-action');ghost.inert=true;ghost.style.width=d.rect.width+'px';ghost.style.height=d.rect.height+'px';ghost.style.left=(d.rect.left-d.bounds.left)+'px';d.parent.append(ghost);d.ghost=ghost;d.el.classList.add('drag-origin');d.siblings.forEach(s=>s.classList.add('moving'));}
e.preventDefault();const top=d.rect.top-d.bounds.top+dy;d.ghost.style.top=top+'px';const center=d.rect.top+dy+d.rect.height/2;let to=d.from;while(to<d.siblings.length-1&&center>d.heights[to+1].top+d.heights[to+1].height/2)to++;while(to>0&&center<d.heights[to-1].top+d.heights[to-1].height/2)to--;d.to=to;const gap=d.siblings.length>1?d.heights[1].top-d.heights[0].bottom:0;d.siblings.forEach((s,i)=>{let shift=0;if(i>d.from&&i<=to)shift=-(d.rect.height+gap);else if(i<d.from&&i>=to)shift=d.rect.height+gap;s.style.transform='translateY('+shift+'px)';});},{passive:false});
document.addEventListener('pointerup',()=>finishDrag());document.addEventListener('pointercancel',()=>finishDrag(true));window.addEventListener('blur',()=>finishDrag(true));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(drag){finishDrag(true);e.preventDefault();}else if(state.modal){dismiss();e.preventDefault();}return;}if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){const g=e.target.closest('[data-drag-group]'),s=e.target.closest('[data-screen]');if(!g&&!s)return;const list=g?state.order:state.opened[s.dataset.group],id=g?g.dataset.dragGroup:s.dataset.screen,from=list.indexOf(id),to=Math.max(0,Math.min(list.length-1,from+(e.key==='ArrowUp'?-1:1)));if(g)state.order=reorder(list,from,to);else state.opened[s.dataset.group]=reorder(list,from,to);e.preventDefault();render(false);document.querySelector(g?'[data-drag-group="'+id+'"]':'[data-screen="'+id+'"]')?.focus();toast('Reordered within '+(g?'remote hosts':s.dataset.group==='local'?'This computer':hosts[s.dataset.group].name)+'.');return;}if(e.key==='Tab'&&state.modal){const els=Array.from(document.querySelectorAll('.dialog button:not(:disabled),.dialog input:not(:disabled),.dialog select'));const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
window.addEventListener('hashchange',()=>scene(location.hash.slice(1)));
state=initial();scene(location.hash.slice(1)||'workspace');

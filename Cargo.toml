[workspace]
resolver = "2"
exclude = ["vendor/gpui-pre-linux"]
members = [
    "crates/splitty-core",
    "crates/splitty-server",
    "crates/splitty-tauri",
    "crates/splitty-remote",
    "crates/splitty-transport",
    "crates/splitty-client-core",
    "crates/splitty-gpui",
    "architecture/check",
]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
rand = "0.8"
hex = "0.4"

[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }

font-size = "11px"
border-radius = "0px"
tab-height = "28px"
tab-font-size = "12.5px"
tab-bar-border = "#cccccc"
tab-accent-color = "#181818"
tab-accent-position = "bottom"

[terminal]
bg = "#eeeeee"
fg = "#181818"
cursor = "#181818"

name = "Splitty Classic Light Gray"
variant = "light"

[palette]
gray-0 = "#e8e8e8"
gray-50 = "#dedede"
gray-100 = "#cccccc"
gray-200 = "#acacac"
gray-300 = "#8c8c8c"
gray-400 = "#6c6c6c"
gray-500 = "#606060"
gray-600 = "#484848"
gray-700 = "#383838"

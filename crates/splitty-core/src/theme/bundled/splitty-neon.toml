name = "Splitty Neon"
variant = "dark"

[palette]
gray-0 = "#d4d4e0"
gray-50 = "#b8b8cc"
gray-100 = "#9898b0"
gray-200 = "#787898"
gray-300 = "#5a5a78"
gray-400 = "#464660"
gray-500 = "#34344c"
gray-600 = "#24243a"
gray-700 = "#1a1a2e"
gray-800 = "#101022"
gray-850 = "#0c0c1a"
gray-900 = "#06060f"
accent = "#ff2d95"
danger = "#ff3333"
warning = "#ffe333"
success = "#33ff77"

[overrides]
surface-raised = "#0c0c1a"
surface-overlay = "#12122a"
hover-bg = "rgba(255, 45, 149, 0.08)"
active-bg = "rgba(255, 45, 149, 0.15)"
accent-muted = "rgba(255, 45, 149, 0.35)"
danger-hover = "rgba(255, 51, 51, 0.18)"
border-default = "#28284a"
border-subtle = "#1c1c38"
scrollbar = "rgba(255, 45, 149, 0.15)"
shadow = "rgba(4, 2, 16, 0.7)"
border-radius = "2px"
tab-height = "32px"
tab-font-size = "11px"
tab-bar-border = "#28284a"
drag-over-border = "1px solid #ff2d95"
font-family = "ui-monospace, \"JetBrains Mono\", \"Fira Code\", \"SF Mono\", \"Cascadia Code\", monospace"

[terminal]
bg = "#06060f"
fg = "#d4d4e0"
cursor = "#ff2d95"
cursor-accent = "#06060f"
selection-bg = "#3a1a40"
selection-fg = "#e0e0f0"
black = "#06060f"
red = "#ff3355"
green = "#33ff77"
yellow = "#ffe333"
blue = "#339cff"
magenta = "#d946ef"
cyan = "#22d3ee"
white = "#d4d4e0"
bright-black = "#626287"
bright-red = "#ff6680"
bright-green = "#66ff99"
bright-yellow = "#ffee66"
bright-blue = "#66b8ff"
bright-magenta = "#e879f9"
bright-cyan = "#67e8f9"
bright-white = "#eeeef8"

[effects]
glow = "true"
glow-color = "#ff2d95"
glow-strength = "8px"
scanlines = "true"
scanline-opacity = "0.04"

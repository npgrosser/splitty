name = "Splitty Retro"
variant = "dark"

[palette]
gray-0 = "#b8c8a8"
gray-50 = "#98ac88"
gray-100 = "#82a070"
gray-200 = "#648858"
gray-300 = "#527248"
gray-400 = "#426240"
gray-500 = "#325030"
gray-600 = "#223a20"
gray-700 = "#1c321a"
gray-800 = "#0c1c0a"
gray-850 = "#081408"
gray-900 = "#031604"
accent = "#39e639"
danger = "#ee4444"
warning = "#ddaa22"
success = "#39e639"

[overrides]
surface-raised = "#0a1e0a"
surface-overlay = "#102610"
hover-bg = "rgba(57, 230, 57, 0.07)"
active-bg = "rgba(57, 230, 57, 0.14)"
accent-muted = "rgba(57, 230, 57, 0.30)"
danger-hover = "rgba(238, 68, 68, 0.16)"
border-default = "#1e5a1e"
border-subtle = "#164216"
scrollbar = "rgba(57, 230, 57, 0.12)"
shadow = "rgba(0, 12, 0, 0.6)"
font-family = "ui-monospace, \"JetBrains Mono\", \"Fira Code\", \"SF Mono\", \"Cascadia Code\", monospace"
font-size = "11px"
border-radius = "0px"
tab-height = "28px"
tab-font-size = "11px"
tab-bar-border = "#1e5a1e"
drag-over-border = "1px solid #39e639"

[terminal]
bg = "#031604"
fg = "#39e639"
cursor = "#39e639"
cursor-accent = "#000000"
selection-bg = "#1e5a1e"
selection-fg = "#39e639"
black = "#031604"
red = "#ee4444"
green = "#39e639"
yellow = "#e8d44d"
blue = "#4499dd"
magenta = "#cc55dd"
cyan = "#44ddcc"
white = "#b8c8a8"
bright-black = "#4e744b"
bright-red = "#ff7766"
bright-green = "#66ee66"
bright-yellow = "#eedd66"
bright-blue = "#66bbee"
bright-magenta = "#dd77ee"
bright-cyan = "#66eedd"
bright-white = "#d4e8c8"

[effects]
glow = "true"
glow-color = "#39e639"
glow-strength = "6px"
scanlines = "true"
scanline-opacity = "0.07"

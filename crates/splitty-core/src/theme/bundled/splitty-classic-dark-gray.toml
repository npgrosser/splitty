name = "Splitty Classic Dark Gray"
variant = "dark"

[palette]
gray-0 = "#e0e0e0"
gray-50 = "#c0c0c0"
gray-100 = "#a0a0a0"
gray-200 = "#808080"
gray-300 = "#686868"
gray-400 = "#585858"
gray-500 = "#484848"
gray-600 = "#3c3c3c"
gray-700 = "#333333"
gray-800 = "#2a2a2a"
gray-850 = "#242424"
gray-900 = "#1e1e1e"
accent = "#e0e0e0"
danger = "#e05050"
warning = "#d0a030"
success = "#50b050"

[overrides]
hover-bg = "rgba(255, 255, 255, 0.06)"
active-bg = "rgba(255, 255, 255, 0.12)"
accent-muted = "rgba(255, 255, 255, 0.20)"
danger-hover = "rgba(224, 80, 80, 0.14)"
border-default = "#3c3c3c"
border-subtle = "#333333"
scrollbar = "rgba(255, 255, 255, 0.10)"
shadow = "rgba(0, 0, 0, 0.5)"
drag-over-border = "1px solid #585858"
font-family = "ui-monospace, \"JetBrains Mono\", \"Fira Code\", \"SF Mono\", \"Cascadia Code\", monospace"
font-size = "11px"
border-radius = "0px"
tab-height = "28px"
tab-font-size = "12.5px"
tab-bar-border = "#3c3c3c"
tab-accent-color = "#e0e0e0"
tab-accent-position = "bottom"

[terminal]
bg = "#1e1e1e"
fg = "#e0e0e0"
cursor = "#e0e0e0"
cursor-accent = "#1e1e1e"
selection-bg = "#454545"
selection-fg = "#ffffff"
black = "#1e1e1e"
red = "#e05050"
green = "#50b050"
yellow = "#d0a030"
blue = "#5090d0"
magenta = "#b060c0"
cyan = "#50b0b0"
white = "#e0e0e0"
bright-black = "#676767"
bright-red = "#f07070"
bright-green = "#70d070"
bright-yellow = "#e0c050"

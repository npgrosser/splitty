name = "Splitty Classic"
variant = "dark"

[palette]
gray-0 = "#e0e0e0"
gray-50 = "#c0c0c0"
gray-100 = "#a0a0a0"
gray-200 = "#808080"
gray-300 = "#686868"
gray-400 = "#585858"
gray-500 = "#484848"
gray-600 = "#383838"
gray-700 = "#282828"
gray-800 = "#181818"
gray-850 = "#101010"
gray-900 = "#080808"
accent = "#e0e0e0"
danger = "#e05050"
warning = "#d0a030"
success = "#50b050"

[overrides]
hover-bg = "rgba(255, 255, 255, 0.06)"
active-bg = "rgba(255, 255, 255, 0.12)"
accent-muted = "rgba(255, 255, 255, 0.20)"
danger-hover = "rgba(224, 80, 80, 0.14)"
border-default = "#383838"
border-subtle = "#282828"
scrollbar = "rgba(255, 255, 255, 0.10)"
shadow = "rgba(0, 0, 0, 0.6)"
drag-over-border = "1px solid #585858"
font-family = "ui-monospace, \"JetBrains Mono\", \"Fira Code\", \"SF Mono\", \"Cascadia Code\", monospace"
font-size = "11px"
border-radius = "0px"
tab-height = "28px"
tab-font-size = "12.5px"
tab-bar-border = "#383838"
tab-accent-color = "#e0e0e0"
tab-accent-position = "bottom"

[terminal]
bg = "#080808"
fg = "#e0e0e0"
cursor = "#e0e0e0"
cursor-accent = "#080808"
selection-bg = "#404040"
selection-fg = "#ffffff"
black = "#080808"
red = "#e05050"
green = "#50b050"
yellow = "#d0a030"
blue = "#5090d0"
magenta = "#b060c0"
cyan = "#50b0b0"
white = "#e0e0e0"
bright-black = "#676767"
bright-red = "#f07070"
bright-green = "#70d070"
bright-yellow = "#e0c050"
bright-blue = "#70b0f0"
bright-magenta = "#d080e0"
bright-cyan = "#70d0d0"
bright-white = "#ffffff"

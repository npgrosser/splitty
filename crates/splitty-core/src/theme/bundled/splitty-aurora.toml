name = "Splitty Aurora"
variant = "dark"

[palette]
gray-0 = "#e8eaed"
gray-50 = "#d3d6db"
gray-100 = "#b0b5bd"
gray-200 = "#8b919c"
gray-300 = "#6c7380"
gray-400 = "#545b68"
gray-500 = "#3e4450"
gray-600 = "#2b3040"
gray-700 = "#1e2233"
gray-800 = "#151928"
gray-850 = "#111522"
gray-900 = "#0a0e18"
accent = "#a78bfa"
danger = "#f87171"
warning = "#fbbf24"
success = "#34d399"

[overrides]
surface-raised = "#111522"
surface-overlay = "#171c2e"
hover-bg = "rgba(167, 139, 250, 0.07)"
active-bg = "rgba(167, 139, 250, 0.13)"
accent-muted = "rgba(167, 139, 250, 0.40)"
danger-hover = "rgba(248, 113, 113, 0.15)"
border-default = "#232842"
border-subtle = "#1a1f36"
scrollbar = "rgba(167, 139, 250, 0.12)"
shadow = "rgba(6, 4, 24, 0.6)"
border-radius = "6px"
tab-border-radius = "6px"
tab-bar-border = "#232842"
pane-gap = "4px"
pane-padding = "4px"
pane-border-radius = "8px"
sash-border-radius = "2px"
sash-color = "rgba(167, 139, 250, 0.15)"
sash-hover-color = "rgba(167, 139, 250, 0.40)"
tab-accent-color = "#a78bfa"
tab-margin = "0.25rem 0.15rem"
dropdown-border-radius = "6px"

[terminal]
bg = "#0a0e18"
fg = "#b0b5bd"
cursor = "#a78bfa"
cursor-accent = "#0a0e18"
selection-bg = "#2d2b55"
selection-fg = "#e8eaed"
black = "#0a0e18"
red = "#f87171"
green = "#34d399"
yellow = "#fbbf24"
blue = "#7dd3fc"
magenta = "#c084fc"
cyan = "#67e8f9"
white = "#b0b5bd"
bright-black = "#616a79"
bright-red = "#fca5a5"
bright-green = "#6ee7b7"
bright-yellow = "#fcd34d"
bright-blue = "#a5f3fc"
bright-magenta = "#d8b4fe"
bright-cyan = "#a5f3fc"
bright-white = "#e8eaed"

[effects]
glow = "true"
glow-color = "#a78bfa"
glow-strength = "10px"

[layout]
dnd-overlay-scope = "global"
dnd-overlay-target = "group"

[package]
name = "splitty-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
splitty-transport = { path = "../splitty-transport" }
splitty-remote = { path = "../splitty-remote" }
splitty-core = { path = "../splitty-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"

[target.'cfg(not(target_os = "windows"))'.dependencies]
splitty-server = { path = "../splitty-server" }

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
splitty-core = { path = "../splitty-core", features = ["testing"] }

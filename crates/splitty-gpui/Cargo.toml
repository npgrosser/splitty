[package]
name = "splitty-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[features]
default = []
# Expose the upstream capture API (native Linux capture is not implemented).
# Enable its feature on the selected backend only. The Kit-wide testing feature
# also resolves its alternative GPUI Fast backend with incompatible pins.
capture = ["dep:gpui-platform-capture"]
ui-test-support = ["capture", "splitty-client-core/ui-test-support"]
web-spike = ["dep:cef", "dep:percent-encoding", "dep:tempfile"]

[dependencies]
splitty-client-core = { path = "../splitty-client-core" }
gpui-kit = { version = "=0.9.0", default-features = false, features = ["assets", "component", "syntect"] }
gpui-platform-capture = { package = "gpui-pre-platform", version = "=0.3.11", features = ["test-support"], optional = true }
tokio.workspace = true
uuid.workspace = true
serde = { workspace = true }
serde_json.workspace = true
anyhow = "1"
linkify = "0.11"
# The viewer's source view; the same highlighter and syntax collection as gpui-kit's "syntect".
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
image = { version = "0.25", default-features = false, features = ["png"] }
cef = { version = "=156.3.0", default-features = false, features = ["sandbox"], optional = true }
percent-encoding = { version = "2", optional = true }
tempfile = { version = "3", optional = true }

# Tests start their services in private directories (`EmbeddedService::isolated`).
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
splitty-client-core = { path = "../splitty-client-core", features = ["ui-test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Verifies the WSL backend archive that ships beside the executable.
sha2 = "0.10"

# The build host compiles the Windows icon and version resource.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

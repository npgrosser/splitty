<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Offscreen composition fixture</title>
<style>
  body { margin: 0; padding: 24px; background: #1b2940; color: #e8efff; font: 18px sans-serif; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  button { background: #a8d4ff; color: #132032; padding: 10px 18px; border: 0; border-radius: 6px; }
  #bar { height: 8px; margin-top: 18px; background: #72e2ba; width: 8px; }
</style>
<h1>Real offscreen Chromium pixels</h1>
<p>Frames: <span id="frames">0</span> · clicks: <span id="clicks">0</span></p>
<button id="button">Click through the native pane</button>
<div id="bar"></div>
<script>
  let frames = 0, clicks = 0;
  document.getElementById('button').onclick = () => {
    document.getElementById('clicks').textContent = String(++clicks);
  };
  setInterval(() => {
    document.getElementById('frames').textContent = String(++frames);
    document.title = `splitty-fixture:${Math.min(frames, 999999)}`;
    document.getElementById('bar').style.width = `${8 + frames % 30 * 16}px`;
  }, 100);
</script>

[package]
name = "splitty-remote"
description = "Reaching a remote host over SSH, installing Splitty's server there and keeping a tunnel to its daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
# The home directory, for the user's ~/.ssh (known hosts).
dirs = "6"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# Paused time for the supervisor's backoff and give-up tests.
tokio = { workspace = true, features = ["test-util"] }

[package]
name = "splitty-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "splitty_server"
path = "src/lib.rs"

[[bin]]
name = "splitty"
path = "src/main.rs"

[dependencies]
splitty-core = { path = "../splitty-core" }
splitty-transport = { path = "../splitty-transport" }
splitty-remote = { path = "../splitty-remote" }
axum = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.10"
hex = "0.4"
sha2 = "0.10"
semver = "1"
http-body-util = "0.1"
# The chunks of offered files (`client_session::files`).
base64 = "0.22"
# The CLI uses HTTP framing over private Unix sockets.
reqwest = { version = "0.12", features = ["json"], default-features = false }
thiserror = "2"
futures = "0.3"
http = "1"
# HTTP client framing for verified legacy daemon migration.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# `splitty download` of a folder: deflate only, through flate2's pure-Rust
# backend (already in the tree), and the archive's own directory.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# `socket` provides SO_PEERCRED and `user` provides geteuid, used by the control
# channel to verify that a connecting process belongs to the same user. `term`
# (termios) and `ioctl` (the window size) are for `splitty attach`'s terminal.
nix = { version = "0.29", features = ["fs", "ioctl", "process", "signal", "socket", "term", "user"] }
dirs = "6"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
async-trait = { workspace = true }
splitty-core = { path = "../splitty-core", features = ["testing"] }
splitty-remote = { path = "../splitty-remote", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
# Message values in the in-process native session test harness.

name: Release

# Builds every artifact for a `v*` tag and publishes them as a GitHub release
# with SHA256SUMS and, for a public repository, build provenance attestations.
# Each platform gets the native app (crates/splitty-gpui). The legacy Tauri
# web app is not released; ci.yml keeps it building.
# A weekly run on main and a run started by hand build everything and publish
# nothing. The release is published only once every platform has built and
# the last release has run against this build (version-skew); a tag with a suffix
# (`v0.2.0-rc.1`) becomes a prerelease. The binaries are not code-signed
# (macOS builds are ad-hoc signed so they run on Apple silicon); the README
# explains how to verify downloads.
# cleanup-release-artifacts.yml removes the run's artifacts after success.
# Failed builds retain their artifacts for three days for investigation.

on:
  push:
    tags: ["v*"]
  # A rehearsal on main that publishes nothing: it shows a broken release
  # build before a tag does and fills the dependency caches the tagged runs
  # restore.
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs; Dependabot keeps the pins and
# their version comments current. Only the publish job can write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag must name the version the sources carry (scripts/release.sh sets
  # both): hosts and the WSL backend install a server per version, so a
  # release under an old version would leave its older server in place.
  # A run started by hand on a branch has no tag to check.
  version:
    name: Version matches the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.ref_type == 'tag'
        with:
          persist-credentials: false

      - name: Check the version files
        if: github.ref_type == 'tag'
        run: scripts/release.sh --check "$GITHUB_REF_NAME"

  # The static servers every desktop app carries for hosts; every platform
  # job waits for them.
  payloads:
    name: Server payloads
    needs: version
    uses: ./.github/workflows/server-payloads.yml
    permissions:
      contents: read

  windows:
    name: Windows
    needs: payloads
    uses: ./.github/workflows/windows-tauri.yml
    with:
      payloads: false
    permissions:
      contents: read

  # The last release against this build at each version boundary
  # (crates/splitty-server/tests/version_skew.rs), before anything publishes.
  # The tag's own release does not exist yet, so the last one is the one before.
  version-skew:
    name: Version skew against the last release
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      # The server embeds frontend/dist; these tests open no page of it.
      - name: Provide an empty frontend build
        run: mkdir -p frontend/dist

      - name: Fetch the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/testing/fetch-last-release.sh --out "$RUNNER_TEMP/splitty-last-release" >> "$GITHUB_ENV"

      - name: Require version skew against the last release
        env:
          SPLITTY_TEST_REQUIRE_RELEASED_BINARY: '1'
        run: cargo test --locked -p splitty-server --test version_skew -- --nocapture

  linux:
    name: Linux
    needs: payloads
    # The oldest supported runner, so the packages work on older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      SPLITTY_REMOTE_PAYLOAD_X86_64: ${{ github.workspace }}/payloads/splitty-wsl-x86_64.tar.gz
      SPLITTY_REMOTE_PAYLOAD_AARCH64: ${{ github.workspace }}/payloads/splitty-wsl-aarch64.tar.gz
      SPLITTY_REMOTE_PAYLOAD_DARWIN_AARCH64: ${{ github.workspace }}/payloads/splitty-darwin-aarch64.tar.gz
      SPLITTY_REMOTE_PAYLOAD_DARWIN_X86_64: ${{ github.workspace }}/payloads/splitty-darwin-x86_64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-payload
          path: payloads

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: remote-payload-aarch64
          path: payloads

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: remote-payload-darwin
          path: payloads

      - name: Verify payloads
        working-directory: payloads
        run: >-
          sha256sum -c splitty-wsl-x86_64.tar.gz.sha256 splitty-wsl-aarch64.tar.gz.sha256
          splitty-darwin-aarch64.tar.gz.sha256 splitty-darwin-x86_64.tar.gz.sha256

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The server linked into the native app embeds the frontend's assets.
      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      # rpmbuild packs the rpm; the rest is what the native app builds
      # against (docs/gpui-spike.md).
      - name: Install rpm tooling and native app build libraries
        timeout-minutes: 10
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes rpm
          libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
          libfontconfig1-dev libfreetype6-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      # Restored from the default branch: a cache saved by a tag's run is
      # visible to that tag only. The weekly run on main keeps it filled.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The cache of ci.yml's native-linux job, which builds the same
          # packages on the same runner for every push to main.
          shared-key: native-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build pinned native terminal library
        run: |
          prefix=$(python3 scripts/bootstrap-libghostty-vt.py --check)
          echo "GHOSTTY_VT_DIR=$prefix" >> "$GITHUB_ENV"

      # The static x86_64 server and CLI: the `splitty` command the app ships.
      - name: Unpack the static x86_64 server
        run: |
          mkdir -p payloads/x86_64
          tar -xzf payloads/splitty-wsl-x86_64.tar.gz -C payloads/x86_64
          payloads/x86_64/splitty --version

      # One executable with the server linked in; it carries the servers for
      # remote hosts named by SPLITTY_REMOTE_PAYLOAD_*.
      - name: Build native app
        env:
          SPLITTY_COMMIT: ${{ github.sha }}
        run: cargo build --locked --release -p splitty-gpui

      - name: Build native deb, rpm and tar.gz
        run: |
          packaging/linux/native/build.sh \
            --executable target/release/splitty-gpui \
            --cli payloads/x86_64/splitty \
            --shell-integration payloads/x86_64/shell-integration \
            --out out

      # The unpacked archive must start: the executable finds its libraries
      # and parses its arguments without opening a window.
      - name: Check native packages
        run: |
          dpkg-deb --info out/splitty_*_amd64.deb
          dpkg-deb --contents out/splitty_*_amd64.deb
          rpm -qip --requires out/splitty-*-1.x86_64.rpm
          mkdir -p "$RUNNER_TEMP/native-unpacked"
          tar -xzf out/splitty-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/native-unpacked"
          app=$(echo "$RUNNER_TEMP"/native-unpacked/splitty-*-linux-x86_64)
          "$app/splitty-gpui" --help
          "$app/splitty" --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: out/*
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS (${{ matrix.arch }})
    needs: payloads
    # The app is built on a runner of its own architecture: Apple silicon
    # and Intel each get a dmg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            server: darwin-aarch64
          - runner: macos-15-intel
            arch: x64
            server: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SPLITTY_REMOTE_PAYLOAD_X86_64: ${{ github.workspace }}/payloads/splitty-wsl-x86_64.tar.gz
      SPLITTY_REMOTE_PAYLOAD_AARCH64: ${{ github.workspace }}/payloads/splitty-wsl-aarch64.tar.gz
      SPLITTY_REMOTE_PAYLOAD_DARWIN_AARCH64: ${{ github.workspace }}/payloads/splitty-darwin-aarch64.tar.gz
      SPLITTY_REMOTE_PAYLOAD_DARWIN_X86_64: ${{ github.workspace }}/payloads/splitty-darwin-x86_64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-payload
          path: payloads

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: remote-payload-aarch64
          path: payloads

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: remote-payload-darwin
          path: payloads

      - name: Verify payloads
        working-directory: payloads
        run: >-
          shasum -a 256 -c splitty-wsl-x86_64.tar.gz.sha256 splitty-wsl-aarch64.tar.gz.sha256
          splitty-darwin-aarch64.tar.gz.sha256 splitty-darwin-x86_64.tar.gz.sha256

      # The cross-built server for macOS hosts must run on a real Mac before
      # any client carries it.
      - name: Run the macOS server of this architecture
        working-directory: payloads
        run: |
          mkdir ${{ matrix.server }}
          tar -xzf splitty-${{ matrix.server }}.tar.gz -C ${{ matrix.server }}
          ${{ matrix.server }}/splitty --version

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      # Restored from the default branch: a cache saved by a tag's run is
      # visible to that tag only. The weekly run on main keeps it filled.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The server linked into the native app embeds the frontend's assets.
      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build pinned native terminal library
        run: |
          prefix=$(python3 scripts/bootstrap-libghostty-vt.py --check --prefix "$RUNNER_TEMP/splitty-ghostty-vt")
          echo "GHOSTTY_VT_DIR=$prefix" >> "$GITHUB_ENV"

      # For this runner's architecture: the terminal library is built for
      # the host. It carries the servers for remote hosts named
      # by SPLITTY_REMOTE_PAYLOAD_*.
      - name: Build native app
        env:
          SPLITTY_COMMIT: ${{ github.sha }}
        run: |
          cargo build --locked --release -p splitty-gpui
          target/release/splitty-gpui --help

      # Ad-hoc signed by the script; ships the server checked above as its
      # `splitty` command.
      - name: Build native dmg
        run: |
          packaging/macos/native/build.sh \
            --executable target/release/splitty-gpui \
            --cli payloads/${{ matrix.server }}/splitty \
            --shell-integration payloads/${{ matrix.server }}/shell-integration \
            --out out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: out/Splitty_*_${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    # A run on a branch (the weekly rehearsal, or one started by hand) builds
    # everything and publishes nothing.
    if: github.ref_type == 'tag'
    needs: [windows, linux, macos, version-skew]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloads

      - name: Assemble release files
        run: |
          mkdir -p release
          # Every file keeps its name; two artifacts with one file name would
          # otherwise replace each other silently.
          collect() {
            local file name
            for file in "$@"; do
              name=$(basename "$file")
              if [ -e "release/$name" ]; then
                echo "two release files are named $name" >&2
                exit 1
              fi
              cp "$file" "release/$name"
            done
          }
          collect downloads/splitty-windows-x64-native/*.exe
          # The static Linux servers and CLIs: x86_64 (the Windows app's WSL
          # backend, carrying the others for remote hosts) and aarch64; and
          # the servers for macOS hosts.
          collect downloads/wsl-payload/splitty-wsl-x86_64.tar.gz
          collect downloads/remote-payload-aarch64/splitty-wsl-aarch64.tar.gz
          collect downloads/remote-payload-darwin/splitty-darwin-*.tar.gz
          collect downloads/release-linux/*
          collect downloads/release-macos-aarch64/*
          collect downloads/release-macos-x64/*
          cd release
          # One of each; a missing or renamed package must not publish.
          for pattern in \
            'Splitty_*_x64-setup.exe' 'Splitty_*_aarch64.dmg' 'Splitty_*_x64.dmg' \
            'splitty_*_amd64.deb' 'splitty-*-1.x86_64.rpm' 'splitty-*-linux-x86_64.tar.gz' \
            'splitty-wsl-x86_64.tar.gz' 'splitty-wsl-aarch64.tar.gz' \
            'splitty-darwin-aarch64.tar.gz' 'splitty-darwin-x86_64.tar.gz'; do
            # shellcheck disable=SC2086 # the pattern is meant to expand
            set -- $pattern
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "expected exactly one release file matching $pattern, found: $*" >&2
              exit 1
            fi
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Attestations need a public repository on GitHub's free plans.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          kind=()
          case "$TAG" in *-*) kind=(--prerelease) ;; esac
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes --verify-tag "${kind[@]}" \
            --title "Splitty $TAG"

name: CI

on:
  push:
    branches: [main]
    # Keep these documentation-only exclusions in sync with codeql.yml.
    # Do not skip all Markdown: agent_guide.md is compiled into the CLI,
    # and architecture tests check the directories under openspec/specs/.
    paths-ignore:
      - '*.md'
      - '**/README.md'
      - 'docs/**/*.md'
      - 'docs/images/**'
      - 'roadmap/**'
      - 'openspec/changes/**'
      - 'openspec/open-decisions.md'
      - '.agents/**/*.md'
      - '.claude/**/*.md'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/README.md'
      - 'docs/**/*.md'
      - 'docs/images/**'
      - 'roadmap/**'
      - 'openspec/changes/**'
      - 'openspec/open-decisions.md'
      - '.agents/**/*.md'
      - '.claude/**/*.md'
  # Only the dependency audit runs weekly: advisories can change without code.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs; Dependabot keeps the pins and
# their version comments current. No job needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            architecture/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust

      - name: Check formatting
        run: cargo fmt --all --check

      # The server embeds and serves frontend/dist; the HTTP surface tests check
      # the headers of the real app document.
      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      # The architecture check (architecture/check) runs LikeC4 inside cargo test.
      - name: Install architecture tooling
        run: pnpm install --frozen-lockfile --dir architecture

      - name: Lint server, core and architecture check
        run: cargo clippy --locked --workspace --exclude splitty-gui --all-targets -- -D warnings

      - name: Test server, core and architecture check
        run: cargo test --locked --workspace --exclude splitty-gui

      # Native policy must actually execute; WSL/container refusal is not proof.
      - name: Require native forwarding reservation lifecycle
        env:
          SPLITTY_TEST_REQUIRE_NATIVE_EXPOSURE: '1'
        run: cargo test --locked -p splitty-remote --test native_exposure -- --exact native_policy_retains_published_worker_after_coordinator_death --nocapture

      # The SSH server is unpacked privately, never installed as a host service.
      # Only this disposable hosted runner's user-namespace policy is adjusted.
      - name: Prepare isolated real SSH crash fixture
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          mkdir -p "${RUNNER_TEMP}/splitty-sshd/packages" "${RUNNER_TEMP}/splitty-sshd/root"
          cd "${RUNNER_TEMP}/splitty-sshd/packages"
          apt-get download openssh-server libwrap0
          for package in ./*.deb; do
            dpkg-deb --extract "$package" "${RUNNER_TEMP}/splitty-sshd/root"
          done
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-current-user --keep-caps --net true

      - name: Require real SSH reconnect, forwarding crash and kept-session migration
        env:
          SPLITTY_TEST_SSHD_ROOT: ${{ runner.temp }}/splitty-sshd/root
          SPLITTY_TEST_REQUIRE_SSH_LAB: '1'
          SPLITTY_TEST_REQUIRE_NATIVE_EXPOSURE: '1'
        run: |
          cargo test --locked -p splitty-server --test remote_connect fixture_cleanup_refuses_processes_outside_its_network_namespace -- --exact --nocapture
          cargo test --locked -p splitty-server --test remote_connect connect_reconnects_and_hands_over_sessions_through_real_ssh -- --exact --nocapture
          cargo test --locked -p splitty-server --test remote_connect exposure_crash::a_published_reverse_worker_blocks_gateway_reuse_after_its_coordinator_is_killed -- --exact --nocapture
          cargo test --locked -p splitty-server --test remote_connect the_hub_updates_a_host_daemon_of_another_version -- --exact --nocapture

  aarch64:
    name: Static server (aarch64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64

      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      # The release builds this server for aarch64 hosts (remote-aarch64);
      # a debug build catches compile and link errors at a fraction of the time.
      - name: Build the server for aarch64-unknown-linux-musl
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --locked -p splitty-server --target aarch64-unknown-linux-musl

  tauri-linux:
    name: Tauri shell (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install WebKitGTK
        timeout-minutes: 10
        run: >-
          sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install --yes
          libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tauri-linux

      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      # Lints the Linux build only; the Windows bridge (windows_wsl::platform)
      # and the macOS window code are compiled on their own platforms.
      - name: Lint Tauri shell
        run: cargo clippy --locked -p splitty-gui --all-targets -- -D warnings

      # Also validates the capabilities against the app manifest (build.rs) and
      # runs the navigation guard tests.
      - name: Test Tauri shell
        run: cargo test --locked -p splitty-gui --lib

  frontend:
    name: Frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Frontend conformance tests type-check the actual Electron adapters.
      - name: Install Electron adapter types
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile --dir frontend-electron

      - name: Check, test and build
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm check && pnpm test && pnpm build

  electron:
    name: Electron shell
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend-electron/pnpm-lock.yaml

      # The Electron build also builds and packages the shared frontend.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --dir frontend

      - name: Type-check and package main-process assets
        working-directory: frontend-electron
        run: pnpm install --frozen-lockfile && pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Policy and documented exceptions: deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories bans sources

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      # Documented exceptions: auditConfig in each pnpm-workspace.yaml.
      - name: npm advisories (frontend)
        working-directory: frontend
        run: pnpm audit

      - name: npm advisories (Electron shell)
        working-directory: frontend-electron
        run: pnpm audit

      - name: npm advisories (architecture tooling)
        working-directory: architecture
        run: pnpm audit

  tauri-macos:
    name: Tauri native runtime (macOS)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tauri-macos
          # Preserve compiled dependencies while platform checks are diagnosed.
          cache-on-failure: true

      # A missing alternate user or WindowServer is a failed verification,
      # never a passing test that silently skipped its OS assertions.
      - name: Verify native runtime prerequisites
        run: |
          /usr/bin/pgrep -x WindowServer
          /usr/sbin/sysctl -n kern.osrelease
          /usr/sbin/lsof -v
          sudo -n -u nobody /usr/bin/python3 -c 'import os, sys; assert os.geteuid() != 0 and os.geteuid() != int(sys.argv[1])' "$(id -u)"

      - name: Build packaged frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Check portable WKWebView harness preparation
        run: |
          python3 scripts/testing/tauri-wkwebview-smoke-test.py
          python3 scripts/testing/tauri-wkwebview-smoke.py --prepare-only --evidence-dir "${RUNNER_TEMP}/splitty-macos-native-evidence"

      - name: Lint and test native macOS application
        run: |
          cargo clippy --locked -p splitty-gui --all-targets -- -D warnings
          cargo test --locked -p splitty-gui --lib

      # Gather the independent native IPC runtime evidence even when a
      # core platform test fails. The final gate still fails this job.
      - name: Test macOS core
        id: core_tests
        continue-on-error: true
        run: cargo test --locked -p splitty-core

      - name: Verify macOS native carrier failure and cancellation cleanup
        run: cargo test --locked -p splitty-remote --lib bridge::tests -- --nocapture

      - name: Verify native endpoint peer-user boundary
        run: cargo test --locked -p splitty-server --test native_endpoint -- --nocapture

      - name: Verify native exposure and explicit gateway positive controls
        env:
          SPLITTY_TEST_REQUIRE_NATIVE_EXPOSURE: '1'
        run: |
          cargo test --locked -p splitty-remote --test native_exposure -- --exact native_policy_retains_published_worker_after_coordinator_death --nocapture
          cargo test --locked -p splitty-server --test daemon_lifecycle start_status_control_command_stop -- --exact
          cargo test --locked -p splitty-server --test daemon_lifecycle process_inventory::inventory_observes_owned_ipv4_and_ipv6_listeners -- --exact
          cargo test --locked -p splitty-server --test daemon_lifecycle owned_native_child_pipes_end_only_their_embedded_sessions -- --exact
          cargo test --locked -p splitty-server --test daemon_lifecycle remote_bridge_relays_native_bytes_and_detaches_without_ending_host_sessions -- --exact
          cargo test --locked -p splitty-server --test daemon_lifecycle an_explicit_daemon_browser_gateway_survives_daemon_replacement_and_detaches_cleanly -- --exact
          cargo build --locked -p splitty-server

      # Real WKWebView/PTY/popout execution; no mock runtime or HTTP UI server.
      - name: Run packaged WKWebView lifecycle smoke
        run: >-
          python3 scripts/testing/tauri-wkwebview-smoke.py
          --full-ui --coexist-daemon --reloads 36
          --evidence-dir "${RUNNER_TEMP}/splitty-macos-native-evidence"

      - name: Verify WKWebView remote isolation and slow consumers
        timeout-minutes: 6
        run: >-
          python3 scripts/testing/tauri-wkwebview-smoke.py
          --isolation-consumer --reloads 1
          --harness-dir "${RUNNER_TEMP}/splitty-macos-isolation-harness"
          --evidence-dir "${RUNNER_TEMP}/splitty-macos-native-evidence/isolation-consumer"

      - name: Enforce macOS core test result
        if: always()
        env:
          CORE_TEST_OUTCOME: ${{ steps.core_tests.outcome }}
        run: |
          if [ "$CORE_TEST_OUTCOME" != success ]; then
            echo '::error::The macOS core suite did not pass; later runtime evidence does not waive this gate.'
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tauri-macos-native-evidence
          path: ${{ runner.temp }}/splitty-macos-native-evidence
          retention-days: 7

name: Hosted WSL forwarding diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 scripts/testing/hosted-wsl-preflight/build.py "$RUNNER_TEMP/wsl-fixture"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-wsl-rootfs
          path: ${{ runner.temp }}/wsl-fixture
          retention-days: 3
  preflight:
    needs: fixture
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hosted-wsl-rootfs
          path: ${{ runner.temp }}/hosted-wsl-rootfs
      - name: Prove owned WSL2 NAT forwarding on and off
        shell: pwsh
        run: ./scripts/testing/hosted-wsl-preflight/run.ps1 -AllowDisposableHostedWslConfig -Artifact "$env:RUNNER_TEMP/hosted-wsl-rootfs" -Evidence "$env:RUNNER_TEMP/hosted-wsl-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: hosted-wsl-evidence
          path: ${{ runner.temp }}/hosted-wsl-evidence
          retention-days: 3
          if-no-files-found: error

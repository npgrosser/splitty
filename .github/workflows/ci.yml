name: Hosted Windows TCP state diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tcp-state:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compare API and CIM states of exact self-owned loopback sockets
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/testing/windows-tcp-state.ps1 -AllowHostedSelfSocketControls -Evidence "$env:RUNNER_TEMP/windows-tcp-state"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-tcp-state
          path: ${{ runner.temp }}/windows-tcp-state
          retention-days: 3
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
    # Keep these documentation-only exclusions in sync with codeql.yml.
    # Do not skip all Markdown: agent_guide.md is compiled into the CLI,
    # and architecture tests check the directories under openspec/specs/.
    paths-ignore:
      - '*.md'
      - '**/README.md'
      - 'docs/**/*.md'
      - 'docs/images/**'
      - 'roadmap/**'
      - 'openspec/changes/**'
      - 'openspec/open-decisions.md'
      - '.agents/**/*.md'
      - '.claude/**/*.md'
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/README.md'
      - 'docs/**/*.md'
      - 'docs/images/**'
      - 'roadmap/**'
      - 'openspec/changes/**'
      - 'openspec/open-decisions.md'
      - '.agents/**/*.md'
      - '.claude/**/*.md'
  # Only the dependency audit runs weekly: advisories can change without code.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs; Dependabot keeps the pins and
# their version comments current. No job needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lints and tests the server, the core and the native desktop app.
  rust:
    name: Rust tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: architecture/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust
          # Pull requests restore the default branch's cache and save none.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Install native app build libraries
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes
          libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
          libfontconfig1-dev libfreetype6-dev libvulkan-dev

      - name: Build pinned native terminal library
        run: |
          prefix=$(python3 scripts/bootstrap-libghostty-vt.py --check)
          echo "GHOSTTY_VT_DIR=$prefix" >> "$GITHUB_ENV"

      # Git for Windows refuses a checkout that holds such a file.
      - name: File names every system can check out
        run: |
          if git ls-files | grep -nE '[<>:"|?*\\]|[ .]$'; then
            echo "these file names cannot be checked out on Windows" >&2
            exit 1
          fi

      # The architecture check (architecture/check) runs LikeC4 inside cargo test.
      - name: Install architecture tooling
        run: pnpm install --frozen-lockfile --dir architecture

      - name: Lint server, core and architecture check
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test server, core and architecture check
        run: cargo test --locked --workspace

      # The native window's view tests are gated on this feature and need no
      # display.
      - name: Test native app views
        run: cargo test --locked -p splitty-gpui --features ui-test-support

      # The last release's static server, checked against its SHA256SUMS, runs
      # against this build at each version boundary (tests/version_skew.rs).
      - name: Fetch the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/testing/fetch-last-release.sh --out "$RUNNER_TEMP/splitty-last-release" >> "$GITHUB_ENV"

      - name: Require version skew against the last release
        env:
          SPLITTY_TEST_REQUIRE_RELEASED_BINARY: '1'
        run: cargo test --locked -p splitty-server --test version_skew -- --nocapture

      # Native policy must actually execute; WSL/container refusal is not proof.
      - name: Require native forwarding reservation lifecycle
        env:
          SPLITTY_TEST_REQUIRE_NATIVE_EXPOSURE: '1'
        run: cargo test --locked -p splitty-remote --test native_exposure -- --exact native_policy_retains_published_worker_after_coordinator_death --nocapture

      # The SSH server is unpacked privately, never installed as a host service.
      # Only this disposable hosted runner's user-namespace policy is adjusted.
      - name: Prepare isolated real SSH crash fixture
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          mkdir -p "${RUNNER_TEMP}/splitty-sshd/packages" "${RUNNER_TEMP}/splitty-sshd/root"
          cd "${RUNNER_TEMP}/splitty-sshd/packages"
          apt-get download openssh-server libwrap0
          for package in ./*.deb; do
            dpkg-deb --extract "$package" "${RUNNER_TEMP}/splitty-sshd/root"
          done
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-current-user --keep-caps --net true

      - name: Require real SSH hub, forwarding and kept-session migration
        env:
          SPLITTY_TEST_SSHD_ROOT: ${{ runner.temp }}/splitty-sshd/root
          SPLITTY_TEST_REQUIRE_SSH_LAB: '1'
          SPLITTY_TEST_REQUIRE_NATIVE_EXPOSURE: '1'
        run: |
          cargo test --locked -p splitty-server --test remote_connect -- --nocapture

  # The packages a release publishes for Linux, built the way release.yml
  # builds them: a release build on the oldest supported runner, packed by
  # packaging/linux/native/build.sh. Catches a broken package script, a
  # library missing on that runner and dependencies that do not install.
  native-linux:
    name: Native app packages (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Shared with the Linux job of release.yml.
          shared-key: native-linux
          # Pull requests restore the default branch's cache and save none.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install rpm tooling and native app build libraries
        timeout-minutes: 10
        run: >-
          sudo apt-get -o Acquire::Retries=3 update &&
          sudo apt-get -o Acquire::Retries=3 install --yes rpm
          libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev
          libfontconfig1-dev libfreetype6-dev libvulkan-dev

      - name: Build pinned native terminal library
        run: |
          prefix=$(python3 scripts/bootstrap-libghostty-vt.py --check)
          echo "GHOSTTY_VT_DIR=$prefix" >> "$GITHUB_ENV"

      # The release ships the static server as the `splitty` command; this
      # build of the same crate stands in for it.
      - name: Build native app and splitty command
        run: cargo build --locked --release -p splitty-gpui -p splitty-server

      - name: Build deb, rpm and tar.gz
        run: |
          packaging/linux/native/build.sh \
            --executable target/release/splitty-gpui \
            --cli target/release/splitty \
            --out out

      - name: Check packages
        run: |
          dpkg-deb --info out/splitty_*_amd64.deb
          dpkg-deb --contents out/splitty_*_amd64.deb
          rpm -qip --requires out/splitty-*-1.x86_64.rpm
          rpm -qlp out/splitty-*-1.x86_64.rpm
          mkdir -p "$RUNNER_TEMP/native-unpacked"
          tar -xzf out/splitty-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/native-unpacked"
          app=$(echo "$RUNNER_TEMP"/native-unpacked/splitty-*-linux-x86_64)
          "$app/splitty-gpui" --help
          "$app/splitty" --version
          # The tar.gz's installer, into a prefix of its own, and its removal.
          "$app/install.sh" --prefix "$RUNNER_TEMP/native-prefix"
          "$RUNNER_TEMP/native-prefix/bin/splitty-gpui" --help
          "$RUNNER_TEMP/native-prefix/bin/splitty" --version
          grep -x "Exec=$RUNNER_TEMP/native-prefix/bin/splitty-gpui" \
            "$RUNNER_TEMP/native-prefix/share/applications/splitty.desktop"
          "$app/install.sh" --prefix "$RUNNER_TEMP/native-prefix" --uninstall
          test ! -e "$RUNNER_TEMP/native-prefix/lib/splitty"

      # The dependencies the deb declares exist and install; the installed
      # command starts.
      - name: Install the deb
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends ./out/splitty_*_amd64.deb
          test -x /opt/splitty/splitty
          test -f /opt/splitty/shell-integration/bash/splitty.bash
          splitty-gpui --help

  # The flake evaluates, and the package of the published release and the
  # pinned terminal library build. The app's build from source is not run
  # here: it compiles everything without a cache.
  nix:
    name: Nix flake
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - name: Evaluate the flake
        run: nix flake check --no-build

      - name: Build the release package and the terminal library
        run: nix build --print-build-logs .#splitty-bin .#libghostty-vt

      - name: Check the release package
        run: |
          package=$(nix build --no-link --print-out-paths .#splitty-bin)
          "$package/bin/splitty" --version
          "$package/bin/splitty-gpui" --help
          test -f "$package/lib/splitty/shell-integration/bash/splitty.bash"

  # The native app on Windows reaches its backend in WSL, which hosted
  # runners cannot start; this compiles the app and its tests.
  native-windows:
    name: Native app (Windows)
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: native-windows
          # Pull requests restore the default branch's cache and save none.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build pinned native terminal library
        shell: pwsh
        run: |
          $prefix = python scripts/bootstrap-libghostty-vt.py --check --prefix (Join-Path $env:RUNNER_TEMP "splitty-ghostty-vt")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "GHOSTTY_VT_DIR=$prefix"

      - name: Build native app
        run: cargo build --locked -p splitty-gpui

      - name: Compile native app tests
        run: cargo check --locked -p splitty-gpui --all-targets

  aarch64:
    name: Static server (aarch64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64
          # Pull requests restore the default branch's cache and save none.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The release builds this server for aarch64 hosts (remote-aarch64);
      # a debug build catches compile and link errors at a fraction of the time.
      - name: Build the server for aarch64-unknown-linux-musl
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --locked -p splitty-server --target aarch64-unknown-linux-musl

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Policy and documented exceptions: deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          command-arguments: advisories bans sources

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - name: npm advisories (architecture tooling)
        working-directory: architecture
        run: pnpm audit

  # The native app (build, tests compiled, disk image packed) on macOS.
  macos:
    name: Native app (macOS)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
          # Pull requests restore the default branch's cache and save none.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Preserve compiled dependencies while platform checks are diagnosed.
          cache-on-failure: true

      # A missing alternate user or WindowServer is a failed verification,
      # never a passing test that silently skipped its OS assertions.
      - name: Verify native runtime prerequisites
        run: |
          /usr/bin/pgrep -x WindowServer
          /usr/sbin/sysctl -n kern.osrelease
          /usr/sbin/lsof -v
          sudo -n -u nobody /usr/bin/python3 -c 'import os, sys; assert os.geteuid() != 0 and os.geteuid() != int(sys.argv[1])' "$(id -u)"

      - name: Build pinned native terminal library
        run: |
          prefix=$(python3 scripts/bootstrap-libghostty-vt.py --check --prefix "$RUNNER_TEMP/splitty-ghostty-vt")
          echo "GHOSTTY_VT_DIR=$prefix" >> "$GITHUB_ENV"

      - name: Build native app
        run: |
          cargo build --locked -p splitty-gpui
          target/debug/splitty-gpui --help

      - name: Compile native app tests
        run: cargo check --locked -p splitty-gpui --all-targets

      # The disk image a release publishes, packed by the release's script
      # from this debug build: the bundle layout, the ad-hoc signature and
      # its verification, and hdiutil.
      - name: Pack native app disk image
        run: |
          cargo build --locked -p splitty-server
          packaging/macos/native/build.sh \
            --executable target/debug/splitty-gpui \
            --cli target/debug/splitty \
            --out "$RUNNER_TEMP/native-macos"
          hdiutil imageinfo "$RUNNER_TEMP"/native-macos/Splitty_*_aarch64.dmg > /dev/null

      # Gather the independent native IPC runtime evidence even when a
      # core platform test fails. The final gate still fails this job.
      - name: Test macOS core
        id: core_tests
        continue-on-error: true
        run: cargo test --locked -p splitty-core

      - name: Verify macOS native carrier failure and cancellation cleanup
        run: cargo test --locked -p splitty-remote --lib bridge::tests -- --nocapture

      - name: Verify native endpoint peer-user boundary
        run: cargo test --locked -p splitty-server --test native_endpoint -- --nocapture

      - name: Verify native exposure and process lifecycle
        env:
          SPLITTY_TEST_REQUIRE_NATIVE_EXPOSURE: '1'
        run: |
          cargo test --locked -p splitty-remote --test native_exposure -- --exact native_policy_retains_published_worker_after_coordinator_death --nocapture
          cargo test --locked -p splitty-server --test daemon_lifecycle start_status_control_command_stop -- --exact
          cargo test --locked -p splitty-server --test daemon_lifecycle process_inventory::inventory_observes_owned_ipv4_and_ipv6_listeners -- --exact
          cargo test --locked -p splitty-server --test daemon_lifecycle owned_native_child_pipes_end_only_their_embedded_sessions -- --exact
          cargo test --locked -p splitty-server --test daemon_lifecycle remote_bridge_relays_native_bytes_and_detaches_without_ending_host_sessions -- --exact
          cargo build --locked -p splitty-server

      - name: Enforce macOS core test result
        if: always()
        env:
          CORE_TEST_OUTCOME: ${{ steps.core_tests.outcome }}
        run: |
          if [ "$CORE_TEST_OUTCOME" != success ]; then
            echo '::error::The macOS core suite did not pass; later runtime evidence does not waive this gate.'
            exit 1
          fi

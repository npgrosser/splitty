# Weekly dependency updates. Minor and patch updates arrive as one grouped pull
# request per ecosystem; major updates arrive one by one, since they are the
# ones that need reading. Security updates are separate and immediate.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend-electron
    schedule:
      interval: weekly
    groups:
      electron-minor-patch:
        update-types: [minor, patch]

  # Also keeps the commit-SHA pins in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
